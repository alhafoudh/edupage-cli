name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: rspec (${{ matrix.os }}, ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is already arm64; the -arm runners add arm64 Linux and Windows.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        # setup-ruby has no Windows arm64 builds older than 3.4.
        exclude:
          - { os: windows-11-arm, ruby: "3.2" }
          - { os: windows-11-arm, ruby: "3.3" }

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: ${{ matrix.os != 'windows-11-arm' }}

      # Nokogiri ships no precompiled gem for Windows arm64 and its bundled libxml2 does
      # not build there, so it is compiled against MSYS2's libxml2 and libxslt instead.
      - name: Install gems against system libxml2 (Windows arm64)
        if: matrix.os == 'windows-11-arm'
        run: |
          ridk exec pacman -S --noconfirm --needed mingw-w64-clang-aarch64-libxml2 mingw-w64-clang-aarch64-libxslt
          bundle config set --local build.nokogiri --use-system-libraries
          bundle install --jobs 4

      # Each OS credential store adapter is tested against the real store on its own
      # platform; the others exclude themselves. The stores are full of sharp edges
      # worth testing for real (security hex-encodes non-ASCII passwords and exits 0 on
      # a mismatched write).
      #
      # macOS: a dedicated unlocked keychain keeps the specs off the runner's login one
      # and avoids depending on how it happens to be configured.
      - name: Create a scratch keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p "" spec.keychain
          security default-keychain -s spec.keychain
          security unlock-keychain -p "" spec.keychain
          security set-keychain-settings spec.keychain

      # Linux: secret-tool needs a Secret Service on a D-Bus session, which the runner
      # does not have. gnome-keyring provides one for the lifetime of the rspec run. The
      # throwaway password must not be empty: with an empty one --unlock never creates
      # the login collection and every store fails with "Object does not exist". Windows needs nothing: the runner user has a
      # Credential Manager of its own.
      - name: Install a Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11

      # The suite never touches the network: WebMock blocks it and the VCR cassettes
      # are :none.
      - if: runner.os != 'Linux'
        run: bundle exec rspec

      - if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c '
            printf spec | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
            bundle exec rspec
          '

  read-only:
    name: no write endpoints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # This project only ever reads from Edupage. Guarding it in CI as well as in the
      # suite means a write endpoint cannot arrive unnoticed through a merge.
      - name: Assert no Edupage write endpoint is referenced
        run: |
          if grep -rnE '(createItem|createReply|homeworkFlag|uploadAtt|signIntoLesson|sendMessage|createConfirmation)' lib/; then
            echo "::error::lib/ references an Edupage write endpoint; this project is read-only"
            exit 1
          fi
          echo "no write endpoints in lib/"
