name: Release

# Publishes whatever version lib/edupage/version.rb names, once CI is green on main.
# Bumping the version is the release trigger; a version that is already out is skipped,
# so every other green push is a no-op.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the tag and the GitHub release
  id-token: write # trusted publishing to rubygems.org, no API key stored anywhere

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI actually tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Read the version
        id: version
        run: |
          version=$(ruby -r ./lib/edupage/version -e 'print Edupage::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Checked separately so a run that pushed the gem but failed before tagging can
      # be retried and finish the job.
      - name: Check what is already released
        id: released
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Before the first release the endpoint answers 404 and curl prints nothing.
          if curl -fsS https://rubygems.org/api/v1/versions/edupage-cli.json 2>/dev/null \
               | ruby -rjson -e 'body = STDIN.read; exit(!body.empty? && JSON.parse(body).any? { |v| v["number"] == ENV["VERSION"] })'; then
            echo "rubygems=true" >> "$GITHUB_OUTPUT"
          else
            echo "rubygems=false" >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "github=true" >> "$GITHUB_OUTPUT"
          else
            echo "github=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the gem
        if: steps.released.outputs.rubygems == 'false' || steps.released.outputs.github == 'false'
        run: gem build edupage-cli.gemspec

      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: steps.released.outputs.rubygems == 'false'

      - name: Push to rubygems.org
        if: steps.released.outputs.rubygems == 'false'
        run: gem push "edupage-cli-${{ steps.version.outputs.version }}.gem"

      - name: Tag and create the GitHub release
        if: steps.released.outputs.github == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh release create "$TAG" "edupage-cli-${{ steps.version.outputs.version }}.gem" \
            --target "$SHA" --title "$TAG" --generate-notes

  # Points the Homebrew formula at the released tag. Runs after every release run, even
  # when nothing new was published, and only commits when the formula actually changes,
  # so a missed bump is repaired by the next run or a manual dispatch.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          repository: alhafoudh/homebrew-edupage
          # A deploy key with write access to the tap and nothing else.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Point the formula at the release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          url="https://github.com/alhafoudh/edupage-cli/archive/refs/tags/$TAG.tar.gz"
          sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          URL="$url" SHA256="$sha256" ruby -e '
            path = "Formula/edupage-cli.rb"
            formula = File.read(path)
              .sub(/^  url ".*"$/, %(  url "#{ENV["URL"]}"))
              .sub(/^  sha256 ".*"$/, %(  sha256 "#{ENV["SHA256"]}"))
            File.write(path, formula)
          '

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "The formula already points at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "edupage-cli $VERSION"
          git push

  # The image for `edupage server --public`, built from the released tag. Like the gem,
  # a version that already has an image is skipped, so re-runs are harmless.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versions tagged before the Dockerfile existed (0.2.0 and older) have no image to
      # build; they count as done.
      - name: Check whether the version already has an image
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
        run: |
          if [ ! -f Dockerfile ] || docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
